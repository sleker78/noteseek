services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: noteseek
      POSTGRES_USER: noteseek
      POSTGRES_PASSWORD: noteseek
    ports:
      - "5433:5432"
    volumes:
      - noteseek_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteseek"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8001:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: noteseek
      DB_USER: noteseek
      DB_PASSWORD: noteseek
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_ENABLED: "true"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  noteseek_postgres_data:
