[project]
name = "noteseek"
version = "0.1.0"
description = "A tiny semantic-notes API built on FastSpine - VectorBase/LlmBase service pattern, pgvector, Redis caching."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastspine[postgres,redis,cli] @ git+https://github.com/sleker78/fastspine.git@v1.1.0",
    "uvicorn[standard]>=0.30.0",
    "pgvector>=0.3.6",
    "openai>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true
